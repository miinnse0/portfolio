const routeNames={'Home':'home','Spatial Design':'spatial','Photography':'photography','Research':'research','About':'about','project':'project','series':'series'};
function readRoute(){
 const parts=location.hash.slice(1).split('/');
 const name=Object.keys(routeNames).find(key=>routeNames[key]===parts[0]);
 if(!name)return null;
 return {page:name,item:Math.max(1,Math.min(name==='series'?2:5,Number(parts[1])||1))};
}
function routeKey(){return routeNames[page]+((page==='project'||page==='series')?'/'+item:'');}

let lastRoute=null,restoringHistory=false;
function recordNavigation(){
 const key=routeKey();
 if(restoringHistory){lastRoute=key;return;}
 if(key===lastRoute)return;
 const state={portfolio:true,page,item,scrollY:0};
 if(lastRoute===null)history.replaceState(state,'','#'+key);
 else history.pushState(state,'','#'+key);
 lastRoute=key;
 window.scrollTo({top:0,left:0,behavior:'instant'});
}
history.scrollRestoration='manual';

 if(!restoringHistory&&history.state?.portfolio)

});

const homePreviewSources={"Spatial Design": ["assets/home-previews/spatial-1.webp", "assets/home-previews/spatial-2.webp", "assets/home-previews/spatial-3.webp", "assets/home-previews/spatial-4.webp", "assets/home-previews/spatial-5.webp"], "Photography": ["assets/home-previews/photography-1.webp", "assets/home-previews/photography-2.webp", "assets/home-previews/photography-3.webp", "assets/home-previews/photography-4.webp", "assets/home-previews/photography-5.webp"], "Research": ["assets/home-previews/research-1.webp", "assets/home-previews/research-2.webp", "assets/home-previews/research-3.webp", "assets/home-previews/research-4.webp", "assets/home-previews/research-5.webp"]};
const homePreviewReady=Object.fromEntries(Object.entries(homePreviewSources).map(([category,sources])=>[category,Promise.all(sources.map(src=>{const image=new Image();image.src=src;return image.decode().catch(()=>{});} ))]));
let homePreviewHideTimer;
function showHomePreview(target){
clearTimeout(homePreviewHideTimer);
const panel=main.querySelector('.home-preview-content');
if(!panel)return;
if(!target){homePreviewHideTimer=setTimeout(()=>{if(panel.isConnected){panel.dataset.section='';panel.querySelectorAll('.home-preview-grid').forEach(grid=>grid.classList.remove('is-visible'));}},90);return;}
panel.dataset.section=target;
if(target==='About'){panel.querySelectorAll('.home-preview-grid').forEach(grid=>grid.classList.remove('is-visible'));return;}
if(!panel.children.length){panel.innerHTML=Object.entries(homePreviewSources).map(([category,sources])=>`<div class="home-preview-grid" data-preview-section="${category}" aria-label="${category} preview" aria-hidden="true">${sources.map(src=>`<img src="${src}" alt="" width="600" height="400" decoding="async">`).join('')}</div>`).join('');}
homePreviewReady[target].then(()=>{if(!panel.isConnected||panel.dataset.section!==target)return;panel.querySelectorAll('.home-preview-grid').forEach(grid=>{const active=grid.dataset.previewSection===target;grid.classList.toggle('is-visible',active);grid.setAttribute('aria-hidden',String(!active));});});
}
root.addEventListener('pointerout',e=>{const building=e.target.closest('[data-home-target]');if(building&&!building.contains(e.relatedTarget))showHomePreview('');});
root.addEventListener('focusout',e=>{if(e.target.closest('[data-home-target]'))showHomePreview('');});
root.addEventListener('pointerover',e=>{const building=e.target.closest('[data-home-target]');if(building)showHomePreview(building.dataset.homeTarget);});
root.addEventListener('focusin',e=>{const building=e.target.closest('[data-home-target]');if(building)showHomePreview(building.dataset.homeTarget);});
root.addEventListener('click',e=>{const building=e.target.closest('[data-home-target]');if(!building)return;e.preventDefault();page=building.dataset.homeTarget;if(page==='Research'){researchCategory='';researchPrintProgress=0;researchPointer=null;researchPrintResumeAt=performance.now()+250;}render();window.scrollTo({top:0,left:0,behavior:'instant'});});

root.addEventListener('pointermove',event=>{
if(performance.now()<researchPrintResumeAt||page!=='Research'||event.pointerType==='touch'||!event.target.closest('.research-rub-zone')){researchPointer=null;return;}
const point={x:event.clientX,y:event.clientY};
if(researchPointer&&researchPrintProgress<1){
const distance=Math.hypot(point.x-researchPointer.x,point.y-researchPointer.y);
researchPrintProgress=Math.min(1,researchPrintProgress+distance*1.15*1.1/(Math.max(window.innerWidth,600)*3*1.3));
const print=main.querySelector('.research-print');
if(print){
const image=print.querySelector('img');
const bounds=print.getBoundingClientRect();
const imageWidth=image.naturalWidth?Math.min(bounds.width,bounds.height*image.naturalWidth/image.naturalHeight):bounds.width;
// Stop at the artwork's right edge, excluding the scan's white margin and contain padding.
const artworkEnd=((bounds.width-imageWidth)/2+imageWidth*0.94)/bounds.width;
print.style.setProperty('--print-reveal',`${researchPrintProgress>=1?100:researchPrintProgress*artworkEnd*100}%`);
}
main.querySelector('.research-rub-zone')?.setAttribute('data-complete',String(researchPrintProgress>=1));
}
researchPointer=point;
});
root.addEventListener('pointerleave',()=>{researchPointer=null;});
const galleryScrollStates=new WeakMap();
root.addEventListener('wheel',event=>{
const gallery=event.target.closest('.research-gallery');
if(!gallery||event.ctrlKey)return;
const delta=(Math.abs(event.deltaX)>Math.abs(event.deltaY)?event.deltaX:event.deltaY)*(event.deltaMode===1?16:event.deltaMode===2?gallery.clientWidth:1);
if(!delta)return;
let state=galleryScrollStates.get(gallery);
if(!state){state={target:gallery.scrollLeft,frame:0};galleryScrollStates.set(gallery,state);}
if(!state.frame)state.target=gallery.scrollLeft;
const limit=gallery.scrollWidth-gallery.clientWidth;
const target=Math.max(0,Math.min(limit,state.target+delta*.8));
if(target===state.target&&!state.frame)return;
event.preventDefault();state.target=target;
if(window.matchMedia('(prefers-reduced-motion: reduce)').matches){gallery.scrollLeft=target;return;}
if(state.frame)return;
let previous=performance.now();
function advance(now){
if(!gallery.isConnected){state.frame=0;return;}
const distance=state.target-gallery.scrollLeft;
if(Math.abs(distance)<.8){gallery.scrollLeft=state.target;state.frame=0;return;}
gallery.scrollLeft+=distance*(1-Math.exp(-Math.min(now-previous,64)/65));previous=now;
state.frame=requestAnimationFrame(advance);
}
state.frame=requestAnimationFrame(advance);
},{passive:false});
root.addEventListener('keydown',event=>{
const gallery=event.target.closest('.research-gallery');
if(!gallery||!['ArrowLeft','ArrowRight'].includes(event.key))return;
event.preventDefault();gallery.scrollBy({left:(event.key==='ArrowRight'?1:-1)*gallery.clientWidth*.7,behavior:window.matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth'});
});
const lightbox=document.createElement('dialog');
lightbox.className='photo-lightbox';lightbox.setAttribute('aria-label','Enlarged photograph');
lightbox.innerHTML='<button class="lightbox-close" aria-label="Close enlarged photograph" autofocus>×</button><img alt="">';
document.body.append(lightbox);
const enlargedPhoto=lightbox.querySelector('img');
let lightboxTrigger=null,previousOverflow='',photoRequest=0;
function closePhoto(){if(lightbox.open)lightbox.close();}
lightbox.addEventListener('close',()=>{photoRequest++;document.body.style.overflow=previousOverflow;enlargedPhoto.removeAttribute('src');if(lightboxTrigger?.isConnected)lightboxTrigger.focus({preventScroll:true});});
lightbox.querySelector('button').addEventListener('click',closePhoto);
lightbox.addEventListener('click',e=>{if(e.target===lightbox)closePhoto();});
root.addEventListener('click',e=>{
const trigger=e.target.closest('[data-photo],[data-research-image]');if(!trigger)return;
const asset=trigger.hasAttribute('data-research-image')?researchAssets[researchCategory]?.[Number(trigger.dataset.researchImage)]:photographyAssets.find(image=>image.number===Number(trigger.dataset.photo));if(!asset)return;
lightboxTrigger=trigger;previousOverflow=document.body.style.overflow;document.body.style.overflow='hidden';
enlargedPhoto.src=asset.preview;enlargedPhoto.alt=asset.alt||`Photograph ${asset.number}`;
lightbox.showModal();
const request=++photoRequest,full=new Image();full.onload=()=>{if(lightbox.open&&request===photoRequest)enlargedPhoto.src=asset.src;};full.src=asset.src;
});
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.hasAttribute('data-research-reset')){researchCategory='';researchPrintProgress=0;researchPointer=null;researchPrintResumeAt=performance.now()+250;const print=main.querySelector('.research-print');if(print)print.style.setProperty('--print-reveal','0%');main.querySelector('.research-rub-zone')?.setAttribute('data-complete','false');main.querySelector('.research-content').replaceChildren();main.querySelectorAll('[data-research-category]').forEach(button=>button.setAttribute('aria-pressed','false'));return;}if(b.dataset.researchCategory){researchCategory=b.dataset.researchCategory;main.querySelectorAll('[data-research-category]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.researchCategory===researchCategory)));main.querySelector('.research-content').innerHTML=researchGallery();return;}if(b.dataset.page){page=b.dataset.page;if(page==='Research'){researchCategory='';researchPrintProgress=0;researchPointer=null;researchPrintResumeAt=performance.now()+250;}}else if(b.dataset.detail){page='project';item=Number(b.dataset.detail);}else if(b.dataset.series){page='series';item=Number(b.dataset.series);}else if(b.dataset.next||b.dataset.prev){const count=page==='project'?5:2;item=(item-1+(b.dataset.next?1:count-1))%count+1;}else return;render();if(b.dataset.next)window.scrollTo({top:0,left:0,behavior:'instant'});window.openai?.setWidgetState({modelContent:{page,item},privateContent:null}).catch(()=>{});});
window.addEventListener('openai:set_globals',e=>{const s=e.detail?.globals?.widgetState?.modelContent;if(s&&[...pages,'project','series'].includes(s.page)){page=s.page;item=Math.max(1,Math.min(s.page==='series'?2:5,Number(s.item)||1));render();}});
render();
if(globalThis.Tweak){const t=new Tweak({container:root,onChange:render});t.addSelect(settings,'index',{label:'Spatial project index',options:['List','Grid']});t.addSlider(settings,'spacing',{label:'Text margins',min:8,max:32,unit:'px'});}
})();
